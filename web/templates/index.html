<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnWatch Data Population Hub</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>OnWatch Data Population Hub</h1>
    <div id="config-badge" class="badge">Checking config…</div>
  </header>

  <section class="actions">
    <h2>Actions</h2>
    <div class="action-row">
      <button id="btn-run-population" class="btn btn-primary">Run Population</button>
      <button id="btn-validate" class="btn btn-secondary">Validate</button>
      <select id="export-select">
        <option value="">-- Select export file --</option>
      </select>
      <button id="btn-refresh-exports" class="btn btn-outline">Refresh</button>
    </div>
  </section>

  <section class="config-status" id="config-section">
    <h2>Config Status</h2>
    <div id="config-content"></div>
    <div class="config-edit">
      <label>Set IP:</label>
      <input type="text" id="config-ip" placeholder="e.g. 192.168.1.100" />
      <button id="btn-set-ip" class="btn btn-outline btn-sm">Set IP</button>
      <label>Set Version:</label>
      <select id="config-version">
        <option value="">-- Select --</option>
        <option value="2.6">2.6</option>
        <option value="2.8">2.8</option>
      </select>
      <button id="btn-set-version" class="btn btn-outline btn-sm">Set Version</button>
      <span id="config-status-msg" class="config-status-msg"></span>
    </div>
  </section>

  <section class="exports" id="exports-section">
    <h2>Exports (run outputs)</h2>
    <div id="exports-list"></div>
  </section>

  <section class="progress-section" id="progress-section">
    <h2>Run Progress <span id="progress-source"></span></h2>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
      <span class="progress-text" id="progress-text"></span>
    </div>
    <div class="progress-steps" id="progress-steps"></div>
    <div class="progress-warnings" id="progress-warnings"></div>
    <div class="progress-summary" id="progress-summary"></div>
  </section>

  <section class="results" id="results-section">
    <h2>Results (latest run)</h2>
    <div id="results-content"></div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
