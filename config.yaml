# OnWatch Automation Configuration
# Paths are relative to project root unless absolute.

# Web UI login - supports multiple users or single user
web_ui:
  # Multi-user: list of {username, password} (each user logs in with own credentials)
  users:
    - username: "Administrator"
      password: "pa$$word!"
    # - username: "alice"
    #   password: "alice-secret"
  # Single user (alternative): username/password - used if 'users' is not set
  # username: "Administrator"
  # password: "pa$$word!"
  secret_key: "change-me-in-production"  # Session signing; override with env OW_WEB_SECRET_KEY

# OnWatch API Connection
onwatch:
  ip_address: "10.1.25.14"
  username: "Administrator"
  password: "pa$$word!"
  base_url: "https://10.1.25.14"
  version: "2.8"  # "2.6" or "2.8"
  # bind_address: "192.168.1.100"  # Optional: force specific interface

# SSH (translation file upload)
ssh:
  ip_address: "10.1.25.14"
  username: "user"
  password: "user1!"
  sudo_password: "user1!"
  # translation_util_path: "/opt/ansible-installer-1.4.0-8/support-scripts/translation-util"

rancher:
  ip_address: "10.1.25.14"
  port: 9443
  username: "admin"
  password: "administrator"
  base_url: "https://10.1.25.14:9443"
  # skip_env_validation: false  # Set true to skip validation (e.g. after 2.8 upgrade)
  workload_path: "/p/local:p-p6l45/workloads/run?launchConfigIndex=-1&namespaceId=default&upgrade=true&workloadId=statefulset%3Adefault%3Acv-engine"

# KV Parameters
kv_parameters:
  "applicationSettings/watchVideo/secondsAfterDetection": 6
  "applicationSettings/watchVideo/secondsBeforeDetection": 6
  "applicationSettings/defaultFaceThreshold": 0.6
  "applicationSettings/maskClassifier/threshold": 0.7
  "DEFAULT/collate-service/TRACKS_RETENTION_TIME_MS": 80000

# System Settings
system_settings:
  general:
    blur_all_faces_except_selected: false
    discard_detections_not_in_watch_list: false
    body_image_retention_period: "13h"
    default_body_threshold: 0.61
    default_liveness_threshold: 0.55
  
  map:
    seed_location:
      lat: 34.01993376317111
      long: -118.50479101075484
    acknowledge: true
    action_title: "call the police"
    masks_access_control: false
  
  system_interface:
    translation_file: "assets/Polski-updated3.json"
    product_name: "metropolis"
    logos:
      company: "assets/images/metropolis-purple.jpg"
      sidebar: "assets/images/Metropolis_Logo.jpg"
    favicon: "assets/images/metropolis-favicon.ico"
  
  engine:
    video_storage:
      all_videos_days: 6
      videos_with_detections_days: 6
    detection_storage_days: 8
    alert_storage_days: 9
    inquiry_storage_days: 8

# Environment Variables (Rancher/Kubernetes)
# OnWatch 2.8: configure manually via Rancher UI (no automated support).
env_vars:
  OVERWRITE_FFMPEG_OPTIONS_VALUES: "ffmpeg-opts:rtsp_transport=udp,reorder_queue_size=8192,max_delay=500000,buffer_size=4194304"
  SERVICE_TAGS: "engine-service,body-from-face-pipeline,body-pipeline,dvr,face-pipeline,ffmpeg-options,forensics,gdpr,image-processing,live-stream,roi,watch-video,webrtc"
  SERVICE_DOMAIN: "cv-engine.default"
  CUDA_DEVICE_ORDER: "PCI_BUS_ID"

# Devices / Cameras
devices:
  - name: "face camera"
    video_url: "rtsp://10.1.70.16:8554/Faces720"
    details:
      threshold: 0.5
      location:
        name: "holon"
        long: 34.800
        lat: 32.007
    calibration:
      tracker: 4
      face_track_length:
        min: 0.5
        max: 11
      calibration_tool:
        padding:
          top: 130
          right: 1768
          bottom: 1060
          left: 201
        detection_min_size: 48
    security_access:
      liveness: true
      liveness_threshold: 0.6
  
  - name: "face camera 2"
    video_url: "rtsp://10.1.70.16:8554/Faces720"
    details:
      threshold: 0.61
      location:
        name: "default"
    calibration:
      tracker: 3
      face_track_length:
        min: 0.2
        max: 10
      calibration_tool:
        padding:
          top: 0
          right: 0
          bottom: 0
          left: 0
        detection_min_size: 48
    security_access:
      liveness: true
      liveness_threshold: 0.55
  
  - name: "Moderate-from-streamer"
    video_url: "rtsp://10.1.70.16:8554/moderate_4_2h"
    details:
      threshold: 0.61
      location:
        name: "default"
    calibration:
      tracker: 3
      face_track_length:
        min: 0.2
        max: 10
      calibration_tool:
        padding:
          top: 0
          right: 0
          bottom: 0
          left: 0
        detection_min_size: 48
    security_access:
      liveness: false
  
  - name: "body camera"
    video_url: "rtsp://service:AnyVision1!@10.1.50.103"
    details:
      threshold: 0.3
      location:
        name: "London"
    calibration:
      tracker: 3
      face_track_length:
        min: 0.2
        max: 10
      calibration_tool:
        padding:
          top: 0
          right: 0
          bottom: 0
          left: 0
        detection_min_size: 20
    security_access:
      liveness: false

# Groups
groups:
  subject_groups:
    - name: "OnPatrol subject"
      authorization: "Always Unauthorized"
      visibility: "Silent"
      priority: 1
    - name: "Cardholders"
      authorization: "Always Authorized"
      visibility: "Visible"
      priority: 2
    - name: "Default Group"
      authorization: "Always Unauthorized"
      visibility: "Silent"
      priority: 0
  
  device_groups:
    - name: "test device group"
      priority: 0
      description: "asdasd"
    - name: "default device group"
      priority: 3
      description: "none"
  

# Accounts
# null password = keep existing.
accounts:
  users:
    - username: "Test"
      first_name: "test"
      last_name: "test"
      email: "test@test.com"
      role: "operator"
      user_group: "full data group"
      api_key: null
      password: "Test123123!"
    - username: "Administrator"
      first_name: "admin"
      last_name: "admin"
      email: null
      role: "super admin"
      user_group: "full data group"
      api_key: null
      password: null
  
  user_groups:
    - title: "testUser group"
      subject_groups: []
      camera_groups: []
    - title: "Full Data Group"
      subject_groups: []
      camera_groups: []

# Inquiries
inquiries:
  - name: "upgrade test"
    files:
      - path: "assets/videos/Neo.mp4"
        settings: "DEFAULT VALUES"
      - path: "assets/videos/Neo.webm"
        settings:
          type: "custom"
          threshold: 0.37
          roi:
            top: 15
            right: 15
            bottom: 22
            left: 0
      - path: "assets/videos/regular_avi_1.avi"
        settings: "DEFAULT VALUES"
      - path: "assets/videos/regular_avi_2.avi"
        settings: "DEFAULT VALUES"
    priority: "Medium"

# Mass Import
mass_import:
  name: "mass-import 43"
  file_path: "assets/mass-import/mass-import-43.tar"

